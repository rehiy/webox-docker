name: Webox nginx-php8.4 Image CI

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/nginx-php8.4.yml'
      - 'all/**'
      - 'nginx-php8.4/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: "true"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./nginx-php8.4
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm
          tags: rehiy/webox:nginx-php8.4
