name: Publish full Webox images

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-full.yml'
      - 'all/**'
      - 'latest/**'
      - 'edge/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [latest, edge]
    concurrency:
      group: publish-full-${{ matrix.image }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and publish
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./${{ matrix.image }}
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: rehiy/webox:${{ matrix.image }}
      - name: Check out component smoke tests
        uses: actions/checkout@v7.0.1
        with:
          repository: rehiy/webox-alpine
          path: component-source
      - name: Verify published image
        env:
          IMAGE_TAG: ${{ matrix.image }}
        run: |
          docker run --rm --pull always \
            -v "$PWD/component-source/tests:/webox-tests:ro" \
            --entrypoint /bin/sh "rehiy/webox:$IMAGE_TAG" -ec '
              nginx -v
              php85 -v
              mariadb --version
              redis-server --version
              sh /webox-tests/smoke.sh full
            '
