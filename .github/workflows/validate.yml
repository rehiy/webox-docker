name: Validate all images

on:
  pull_request:
    paths:
      - '**/Dockerfile'
      - '**/deploy'
      - 'all/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - edge
          - latest
          - legal-php7
          - nginx
          - nginx-geoip
          - nginx-php5.6
          - nginx-php7.3
          - nginx-php7.4
          - nginx-php8.0
          - nginx-php8.1
          - nginx-php8.2
          - nginx-php8.3
          - nginx-php8.4
          - nginx-php8.5
          - slim
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build without publishing
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./${{ matrix.image }}
          push: false
          platforms: linux/amd64,linux/arm64,linux/arm
